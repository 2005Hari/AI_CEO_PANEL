services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios_dev_password
      POSTGRES_DB: ai_startup_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d ai_startup_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
