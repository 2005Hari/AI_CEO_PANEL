name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (migrations + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios_dev_password
          POSTGRES_DB: ai_startup_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d ai_startup_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scoped to this step only: the test suite below must NOT inherit these,
      # since tests/conftest.py forces USE_SQLITE=true + mock auth via
      # os.environ.setdefault(...), and running it against real Postgres
      # instead exposes unrelated cross-event-loop errors in the test fixtures.
      - name: Apply Alembic migrations against a fresh Postgres + pgvector instance
        working-directory: backend
        env:
          USE_SQLITE: "false"
          AUTH_REQUIRED: "false"
          DEV_MOCK_USER_ENABLED: "true"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios_dev_password
          POSTGRES_DB: ai_startup_os
          NVIDIA_API_KEY: ci_dummy_key
        run: python -m alembic upgrade head

      - name: Run backend test suite (merge gate)
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
